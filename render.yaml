services:
  - type: web
    name: wa-acai-backend
    runtime: python
    rootDir: backend
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.app.main:app --host 0.0.0.0 --port $PORT
    autoDeployTrigger: commit
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: DATABASE_URL
        fromDatabase:
          name: wa-acai-db
          property: connectionString
      - key: CORS_ORIGINS
        sync: false

databases:
  - name: wa-acai-db
    databaseName: waacai
    user: waacai
    plan: free
